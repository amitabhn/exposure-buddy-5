# Supabase CLI configuration — https://supabase.com/docs/guides/cli/config
# project_id is a placeholder; replace with real project ref from Supabase dashboard (Story 1.7 → Epic 2)
project_id = "exposure-buddy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Password sign-up (sign-in.tsx) assumes no session == "identifier already
# registered". That's only true while confirmations stay off — if this is
# ever flipped on, a legitimate new signup would be misdiagnosed as a
# duplicate (see Story 10.1 code review, Decision 2).
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
