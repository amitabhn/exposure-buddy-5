# Supabase CLI configuration — https://supabase.com/docs/guides/cli/config
# project_id is the real ref for the hosted "Exposure Buddy" project (ap-northeast-1)
project_id = "jhbtzsvlgglyfbrgmpsb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Password sign-up (sign-in.tsx) assumes no session == "identifier already
# registered". That's only true while confirmations stay off — if this is
# ever flipped on, a legitimate new signup would be misdiagnosed as a
# duplicate (see Story 10.1 code review, Decision 2).
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

# enable_signup alone does not flip GoTrue's phone channel on locally — the
# Supabase CLI forces GOTRUE_EXTERNAL_PHONE_ENABLED=false ("no SMS provider is
# enabled. Disabling phone login") unless a provider block below is present
# with enabled = true. These are fake/unused credentials: enable_confirmations
# = false above means signup autoconfirms, so no SMS ever actually needs to
# send. This provider is never contacted in local dev.
[auth.sms.twilio]
enabled = true
account_sid = "test_sid"
auth_token = "test_token"
message_service_sid = "test_service_sid"

[analytics]
enabled = false
