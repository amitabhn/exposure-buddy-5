# PowerSync Sync Streams config — converted from supabase/sync-rules.yaml's
# legacy Sync Rules (bucket_definitions) to Sync Streams (edition 3) per the
# powersync skill's guidance ("Sync Streams for new projects"). Same data,
# same per-user scoping — bucket.user_id/token_parameters.user_id become
# auth.user_id(); the suds_readings join is expressed as INNER JOIN.

config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      # users — added Story 9.1 (was previously write-only via outbox; never synced down)
      - SELECT id, email, created_at
        FROM users
        WHERE id = auth.user_id()

      # user_onboarding_metadata — added Story 9.1
      - SELECT id, user_id, suds_calibration_value, completed_at, created_at
        FROM user_onboarding_metadata
        WHERE user_id = auth.user_id()

      # fear_ladder_items — column renamed actual_suds -> peak_suds in migration 0015
      - SELECT id, user_id, description, predicted_suds, peak_suds, position, status, created_at, updated_at
        FROM fear_ladder_items
        WHERE user_id = auth.user_id()

      - SELECT id, user_id, fear_item_id, session_type, status,
               pre_session_intention, post_session_reflection,
               started_at, ended_at, expires_at, created_at, technique
        FROM exposure_sessions
        WHERE user_id = auth.user_id()

      # suds_readings — no user_id column; scoped via exposure_sessions join.
      # No alias on the FROM table: Sync Streams syncs the row under its FROM-clause
      # alias when one is present, so aliasing this to "sr" would sync it as a
      # client-side table named "sr" instead of "suds_readings" (flagged by
      # `powersync deploy`'s own validation) -- the joined exposure_sessions table
      # keeps its "es" alias since it isn't the row source, only the join condition.
      - SELECT suds_readings.id, suds_readings.session_id, suds_readings.suds_value, suds_readings.recorded_at
        FROM suds_readings
        INNER JOIN exposure_sessions es ON es.id = suds_readings.session_id
        WHERE es.user_id = auth.user_id()
