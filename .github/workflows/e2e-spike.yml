name: E2E Spike — Android emulator + local build feasibility

# Story 9.5, Task 1 spike: validates that (a) a KVM-enabled Android emulator boots on
# ubuntu-latest, (b) eas build --local produces an installable APK on this runner,
# and (c) supabase start runs successfully and is reachable from the emulator.
#
# Trigger manually (workflow_dispatch) once before relying on the full e2e-smoke job.
# After the spike confirms all three pieces work, this file can be archived/removed.
# If Task 1.4 finds the ubuntu-latest/KVM path infeasible, record the fallback used
# in the story's Completion Notes and update run-e2e-smoke.sh + ci.yml accordingly.
on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Standard Supabase local-dev demo JWT — same for every `supabase start` instance
  LOCAL_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0'

jobs:
  # ─── Spike 1.1 + 1.2 + 1.3 + 1.5 + 1.6: KVM emulator + local EAS build + Supabase ──────────
  e2e-infrastructure-spike:
    name: "Spike — Android emulator + EAS build + Supabase"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1.1: Enable KVM for hardware-accelerated Android virtualization ──────────
      - name: Enable KVM (udev rules)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── 1.3: Start local Supabase (Docker) ───────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Verify Supabase is healthy
        run: supabase status

      # ── 1.2: Set up pnpm + Node + install deps (needed for EAS build) ────────────
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── 1.2: Set up EAS CLI + Java/Android SDK ────────────────────────────────────
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Set up Java (Android build requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 1.2: Attempt local EAS build ─────────────────────────────────────────────
      # If eas build --local fails (missing Android SDK components, licensing issues,
      # etc.), document the blocker in story Completion Notes and fall back to
      # expo prebuild + ./gradlew assembleDebug per Task 1.2's pre-authorized fallback.
      - name: Build APK (eas build --local, e2e profile)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: "http://10.0.2.2:54321"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_ANON_KEY }}
        run: |
          eas build --profile e2e --platform android --local --non-interactive \
            --output /tmp/exposure-buddy-e2e.apk || {
            echo "::warning::eas build --local failed — attempting expo prebuild + Gradle fallback"
            cd "$GITHUB_WORKSPACE"
            pnpm exec expo prebuild --platform android --clean
            cd "$GITHUB_WORKSPACE/apps/mobile/android"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/exposure-buddy-e2e.apk
          }
          echo "APK produced at /tmp/exposure-buddy-e2e.apk"
          ls -lh /tmp/exposure-buddy-e2e.apk

      # ── 1.1: Boot Android emulator and verify it starts ──────────────────────────
      - name: Boot Android emulator (API 31, KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: Nexus 6
          avd-name: spike_emulator
          locale: en_US
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            echo "Emulator booted successfully"
            adb devices

            # ── 1.3: Confirm emulator can reach Supabase at 10.0.2.2:54321 ─────────
            # Install curl on the emulator via adb shell (if available) or use nc
            adb shell "curl -sf http://10.0.2.2:54321/rest/v1/ \
              -H 'apikey: ${{ env.LOCAL_ANON_KEY }}' \
              -H 'Authorization: Bearer ${{ env.LOCAL_ANON_KEY }}'" && \
              echo "PASS: Emulator can reach local Supabase at 10.0.2.2:54321" || \
              echo "WARNING: Could not verify Supabase reachability from emulator — check network config"

            # Install and launch the APK briefly to confirm it runs
            adb install /tmp/exposure-buddy-e2e.apk
            adb shell monkey -p com.exposurebuddy.app -c android.intent.category.LAUNCHER 1 || true
            echo "SPIKE PASS: APK installed and launched"

            # ── 1.5: Check PowerSync reachability (open question) ─────────────────
            echo "TODO 1.5: If EXPO_PUBLIC_POWERSYNC_URL is not set in the e2e profile,"
            echo "          fear_ladder_items seeded via PostgREST may not appear in"
            echo "          the on-device UI (PowerSync reads from local SQLite replica)."
            echo "          Verify this empirically: seed a row via curl, install app,"
            echo "          and check if /ladder shows it. If not, seed via app UI instead."

            # ── 1.6: MMKV state persistence across separate maestro test invocations ─
            echo "TODO 1.6: Confirm MMKV persists across flow files within one maestro test"
            echo "          invocation on this emulator setup. If ensureOnboarded.yaml's"
            echo "          no-op path (already-onboarded) works, the performance optimization"
            echo "          holds. If not, each flow re-onboards from scratch — still correct,"
            echo "          just slower."
