name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: '22'

jobs:
  # ─── Gate 1: packages/core import boundary (ARC-011) ───────────────────────
  core-boundary-gate:
    name: "ARC-011 — packages/core boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check packages/core has no forbidden imports
        run: |
          if grep -rE "from ['\"]react-native|from ['\"]expo|from ['\"]@supabase|require\(['\"]react-native|require\(['\"]expo|require\(['\"]@supabase|import\(['\"]react-native|import\(['\"]expo|import\(['\"]@supabase" packages/core/src 2>/dev/null; then
            echo "FAIL: packages/core contains forbidden imports (react-native, expo-*, @supabase/*)"
            echo "packages/core must remain pure TypeScript with zero framework dependencies (ARC-011)"
            exit 1
          fi
          echo "PASS: packages/core boundary is clean"

  # ─── Gate 2: Dark mode lock (ADR-DARK-MODE-NATIVEWIND, UX-DR22) ────────────
  dark-mode-gate:
    name: "ADR-DARK-MODE — userInterfaceStyle must be light"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify userInterfaceStyle is locked to light
        run: |
          if ! grep -qE "userInterfaceStyle:\s*['\"]light['\"]" apps/mobile/app.config.ts; then
            echo "FAIL: apps/mobile/app.config.ts userInterfaceStyle is not 'light'"
            echo "Dark mode is deferred to post-MVP. See ADR-DARK-MODE-NATIVEWIND."
            exit 1
          fi
          echo "PASS: userInterfaceStyle is locked to 'light'"

  # ─── Gate 3: apps/web import gate (ADR-009) ────────────────────────────────
  web-import-gate:
    name: "ADR-009 — Phase 1 code must not import from apps/web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no Phase 1 code imports from apps/web
        run: |
          if grep -rE "from ['\"].*apps/web" apps/mobile/src apps/mobile/app packages/ 2>/dev/null; then
            echo "FAIL: Phase 1 code imports from apps/web (ADR-009)"
            exit 1
          fi
          echo "PASS: No Phase 1 code imports from apps/web"

  # ─── Gate 4: SDK dependency audit (ARC-013) ────────────────────────────────
  sdk-dep-audit:
    name: "ARC-013 — SDK dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flag new third-party data-transmitting dependencies
        run: |
          # ARC-013: Approved data-transmitting deps — reviewed and signed off
          # Add to this list (with story reference) when a new one is approved via PR review
          APPROVED_DEPS=(
            "@sentry/react-native"  # Story 1.1 — crash reporting to sentry.io, approved
          )

          FLAGGED_PATTERNS=("sentry" "analytics" "posthog" "mixpanel" "amplitude" "datadog" "newrelic" "crashlytics" "firebase" "segment" "heap" "fullstory")
          FOUND_ISSUES=0
          for pattern in "${FLAGGED_PATTERNS[@]}"; do
            MATCHES=$(grep -ril "\"$pattern" apps/*/package.json packages/*/package.json 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              for match_file in $MATCHES; do
                UNAPPROVED=$(grep -i "\"$pattern" "$match_file" || true)
                for approved in "${APPROVED_DEPS[@]}"; do
                  UNAPPROVED=$(echo "$UNAPPROVED" | grep -v "\"$approved\"" || true)
                done
                if [ -n "$UNAPPROVED" ]; then
                  echo "REVIEW REQUIRED: '$pattern' found in $match_file"
                  echo "$UNAPPROVED"
                  FOUND_ISSUES=1
                fi
              done
            fi
          done
          if [ "$FOUND_ISSUES" -eq 1 ]; then
            echo "ARC-013: New data-transmitting dependencies require explicit sign-off before merge."
            exit 1
          fi
          echo "PASS: No unreviewed third-party data transmitters found"

  # ─── Gate 5: Supabase client import boundary (ARC-006) ─────────────────────
  supabase-import-gate:
    name: "ARC-006 — @supabase/supabase-js boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check @supabase/supabase-js only imported inside packages/supabase
        run: |
          if grep -rE "from ['\"]@supabase/supabase-js['\"]|require\(['\"]@supabase/supabase-js['\"]" \
            apps/ packages/sync/ packages/ui/ packages/core/ 2>/dev/null; then
            echo "FAIL: @supabase/supabase-js imported outside packages/supabase (ARC-006)"
            echo "Use @exposure-buddy/supabase instead"
            exit 1
          fi
          echo "PASS: @supabase/supabase-js boundary is clean"

  # ─── Gate 6: actual_suds rename guard (AC1 / Story 5.2) ────────────────────
  actual-suds-rename-gate:
    name: "AC1 — no actual_suds references post-migration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual_suds was fully renamed to peak_suds
        run: |
          if grep -r "actual_suds" packages/ apps/ supabase/migrations/ | grep -v "0015_rename\|0013_fear_ladder_items"; then
            echo "FAIL: 'actual_suds' reference found outside the rename migration (AC1 / Story 5.2)"
            echo "All references must use 'peak_suds'. See supabase/migrations/0015_rename_actual_suds_to_peak_suds.sql"
            exit 1
          fi
          echo "PASS: no actual_suds references found"

  # ─── Gate 7: PowerSync schema drift (Story 9.1 / NFR-OFFLINE-01) ───────────
  verify-schema-drift:
    name: "Story 9.1 — verify-schema-drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packages/sync/src/schema.ts matches migration history
        run: bash scripts/ci/verify-schema-drift.sh

  # ─── Gate 8: PowerSync sync-rules bucket coverage (Story 9.1) ──────────────
  verify-sync-bucket-coverage:
    name: "Story 9.1 — verify-sync-bucket-coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every AppSchema table has sync-rules.yaml bucket coverage
        run: bash scripts/ci/verify-sync-bucket-coverage.sh

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: "Build all packages"
    runs-on: ubuntu-latest
    needs: [core-boundary-gate, dark-mode-gate, web-import-gate, sdk-dep-audit, supabase-import-gate, actual-suds-rename-gate, verify-schema-drift, verify-sync-bucket-coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo build

  # ─── Typecheck ──────────────────────────────────────────────────────────────
  typecheck:
    name: "TypeScript — strict mode"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm turbo typecheck

  # ─── Lint — i18n + a11y gates (Story 1.6) ───────────────────────────────────
  lint:
    name: "Lint — i18n + a11y gates"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint all packages
        run: pnpm turbo lint

  # ─── Test — Vitest (packages) + Jest (apps/mobile) (Story 9.2) ─────────────
  # First repo-wide test gate: pnpm turbo test fans out to every package/app's
  # existing test task via turbo.json, not just this story's new offline-recovery
  # suites — see Story 9.2 Task 7.2.
  test:
    name: "Test — Vitest + Jest"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all package/app test suites
        run: pnpm turbo test

  # ─── E2E APK build (Story 9.5) — build the release APK once, share to all shards ────
  # Split out from the emulator job so the ~37 min Gradle build runs once instead of per
  # shard. Uploads the APK as an artifact consumed by every e2e-smoke matrix shard.
  e2e-build-apk:
    name: "E2E Build APK"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java (Android build requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Build APK. 10.0.2.2 is the Android emulator's loopback alias for the host's
      # localhost where each shard's local Supabase listens. ──────────────────────────
      - name: Build E2E APK
        run: |
          cd apps/mobile
          APP_VARIANT="preview" \
          EXPO_PUBLIC_APP_VARIANT="preview" \
          EXPO_PUBLIC_SUPABASE_URL="http://10.0.2.2:54321" \
          EXPO_PUBLIC_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" \
          pnpm exec expo prebuild --platform android --clean
          # E2E APK only: allow cleartext HTTP so the app can reach the local Supabase at
          # http://10.0.2.2:54321. assembleRelease targets SDK >= 28, where cleartext traffic
          # defaults to disabled; without this the app's Supabase auth/OTP calls fail silently.
          # This build is never shipped — production EAS builds use HTTPS and a separate path.
          perl -0pi -e 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/ or s/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml || (echo "ERROR: cleartext patch did not apply" && exit 1)
          cd android
          APP_VARIANT="preview" \
          EXPO_PUBLIC_APP_VARIANT="preview" \
          EXPO_PUBLIC_SUPABASE_URL="http://10.0.2.2:54321" \
          EXPO_PUBLIC_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" \
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk /tmp/exposure-buddy-e2e.apk
          echo "APK built: $(du -sh /tmp/exposure-buddy-e2e.apk | cut -f1)"

      - name: Upload E2E APK
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: /tmp/exposure-buddy-e2e.apk
          retention-days: 1
          if-no-files-found: error

  # ─── E2E Smoke — Maestro flows, SHARDED across parallel emulators (Story 9.5) ────────
  # Each shard is its own runner: fresh emulator + fresh local Supabase, running only its
  # flows. The GitHub runner has ~7.8 GB RAM shared between the emulator and Supabase
  # Docker, and the emulator/QEMU was getting OOM-killed after ~4 heavy flows in one
  # session (adb went UNAVAILABLE / clearState failed). Capping each shard at <=2 heavy
  # flows keeps every emulator well within its healthy window. The APK is built once by
  # e2e-build-apk and downloaded here (no per-shard Gradle build).
  #
  # `onboarding` is quarantined (optional: true → continue-on-error): it exercises the REAL
  # signInWithOtp path, whose HTTP request does not reach GoTrue from the emulator in CI
  # (works locally; no POST /otp server-side, so no OTP email). Kept running for visibility
  # but not gating. See project docs / story Completion Notes.
  e2e-smoke:
    name: "E2E Smoke (${{ matrix.name }})"
    runs-on: ubuntu-latest
    needs: [e2e-build-apk]
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            optional: false
            flows: apps/mobile/.maestro/ladder-build.yaml apps/mobile/.maestro/exposure-loop.yaml
          - name: session
            optional: false
            flows: apps/mobile/.maestro/debrief.yaml apps/mobile/.maestro/backgrounded-recovery.yaml
          - name: onboarding
            optional: true
            flows: apps/mobile/.maestro/onboarding.yaml
    steps:
      - uses: actions/checkout@v4

      # ── Reclaim disk space (android system image + Supabase Docker images are large) ──
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # ── KVM for hardware-accelerated Android virtualization ─────────────────────
      - name: Enable KVM (udev rules)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Set up Java (sdkmanager requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Pre-download system image (android-emulator-runner otherwise downloads it
      # inside the step, competing with the boot timeout). ─────────────────────────────
      - name: Download Android system image
        run: sdkmanager "system-images;android-31;default;x86_64"

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      # ── Download the release APK built once by e2e-build-apk ─────────────────────────
      - name: Download E2E APK
        uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: /tmp

      # ── Start local Supabase for this shard (reads keys into GITHUB_ENV) ─────────────
      - name: Start Supabase
        run: |
          supabase start
          eval "$(supabase status -o env 2>/dev/null | grep -E '^[A-Z_][A-Z0-9_]*=')"
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-}}"
          SUPABASE_URL="${SUPABASE_URL:-${API_URL:-http://127.0.0.1:54321}}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=${SUPABASE_URL}" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=http://127.0.0.1:54324" >> "$GITHUB_ENV"

      - name: Pre-emulator diagnostics
        run: |
          echo "=== Disk ===" && df -h /
          echo "=== Memory ===" && free -h
          echo "=== KVM ===" && ls -la /dev/kvm 2>/dev/null || echo "WARNING: /dev/kvm not found"

      # ── Virtual framebuffer — swiftshader_indirect needs an X display even in
      # -no-window mode to initialize its EGL context. ─────────────────────────────────
      - name: Start Xvfb (virtual display for SwiftShader renderer)
        run: |
          sudo apt-get install -y xvfb
          Xvfb :0 -screen 0 1280x720x24 &
          echo "DISPLAY=:0" >> "$GITHUB_ENV"

      # ── Boot a fresh emulator and run only this shard's flows ────────────────────────
      # emulator-options rationale: -no-snapshot/-no-snapstorage avoid QEMU snapshot-init
      # crashes in CI; -gpu swiftshader_indirect uses the bundled host renderer;
      # -partition-size 4096 fits the userdata partition alongside Supabase Docker.
      # Guest RAM is left at the AVD default: on the ~7.8 GB runner, forcing -memory 4096
      # starved the host and got QEMU OOM-killed — sharding (few flows/emulator), not more
      # guest RAM, is what keeps the emulator alive.
      - name: Run E2E smoke shard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: Nexus 6
          avd-name: e2e_smoke_emulator
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapstorage -partition-size 4096
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            export PATH="$PATH:$HOME/.maestro/bin" &&
            mkdir -p /tmp/maestro-artifacts &&
            adb logcat -c &&
            (adb logcat -v time > /tmp/maestro-artifacts/logcat.txt 2>&1 &) &&
            adb install -r /tmp/exposure-buddy-e2e.apk &&
            (for i in 1 2 3 4 5; do adb shell "curl -sf -o /dev/null http://10.0.2.2:54321/auth/v1/health" && break || sleep 2; done) &&
            ~/.maestro/bin/maestro test
            ${{ matrix.flows }}
            --format junit
            --output /tmp/maestro-artifacts/report.xml
            --env SUPABASE_URL="${SUPABASE_URL}"
            --env MAILPIT_URL="${MAILPIT_URL}"
            --env SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
            --env APP_PACKAGE="com.exposurebuddy.app"

      - name: Dump emulator state on failure
        if: failure()
        run: |
          echo "=== Disk ===" && df -h / || true
          echo "=== Memory ===" && free -h || true
          echo "=== KVM ===" && ls -la /dev/kvm 2>/dev/null || echo "KVM absent"
          echo "=== AVD contents ===" && ls -la ~/.android/avd/e2e_smoke_emulator.avd/ 2>/dev/null || true

      # ── GoTrue (auth) + mail container logs — the only server-side view of the OTP path
      # (the release APK strips the JS console, so there is no app-side error). ──────────
      - name: Dump Supabase container logs on failure
        if: failure()
        run: |
          echo "=== Supabase containers ==="
          docker ps -a --format '{{.Names}} -> {{.Status}}' | grep -i supabase || true
          for c in $(docker ps -a --format '{{.Names}}' | grep -iE 'supabase.*(auth|inbucket|mailpit)' || true); do
            echo "===== docker logs $c (last 300) ====="
            docker logs --tail 300 "$c" 2>&1 || true
          done

      # Artifact names are shard-scoped — upload-artifact@v4 rejects duplicate names.
      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-artifacts-${{ matrix.name }}
          path: /tmp/maestro-artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Maestro debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-logs-${{ matrix.name }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: warn
