name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Gate 1: packages/core import boundary (ARC-011) ───────────────────────
  core-boundary-gate:
    name: "ARC-011 — packages/core boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check packages/core has no forbidden imports
        run: |
          if grep -rE "from ['\"]react-native|from ['\"]expo|from ['\"]@supabase|require\(['\"]react-native|require\(['\"]expo|require\(['\"]@supabase|import\(['\"]react-native|import\(['\"]expo|import\(['\"]@supabase" packages/core/src 2>/dev/null; then
            echo "FAIL: packages/core contains forbidden imports (react-native, expo-*, @supabase/*)"
            echo "packages/core must remain pure TypeScript with zero framework dependencies (ARC-011)"
            exit 1
          fi
          echo "PASS: packages/core boundary is clean"

  # ─── Gate 2: Dark mode lock (ADR-DARK-MODE-NATIVEWIND, UX-DR22) ────────────
  dark-mode-gate:
    name: "ADR-DARK-MODE — userInterfaceStyle must be light"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify userInterfaceStyle is locked to light
        run: |
          if ! grep -qE "userInterfaceStyle:\s*['\"]light['\"]" apps/mobile/app.config.ts; then
            echo "FAIL: apps/mobile/app.config.ts userInterfaceStyle is not 'light'"
            echo "Dark mode is deferred to post-MVP. See ADR-DARK-MODE-NATIVEWIND."
            exit 1
          fi
          echo "PASS: userInterfaceStyle is locked to 'light'"

  # ─── Gate 3: apps/web import gate (ADR-009) ────────────────────────────────
  web-import-gate:
    name: "ADR-009 — Phase 1 code must not import from apps/web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no Phase 1 code imports from apps/web
        run: |
          if grep -rE "from ['\"].*apps/web" apps/mobile/src apps/mobile/app packages/ 2>/dev/null; then
            echo "FAIL: Phase 1 code imports from apps/web (ADR-009)"
            exit 1
          fi
          echo "PASS: No Phase 1 code imports from apps/web"

  # ─── Gate 4: SDK dependency audit (ARC-013) ────────────────────────────────
  sdk-dep-audit:
    name: "ARC-013 — SDK dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flag new third-party data-transmitting dependencies
        run: |
          # ARC-013: Approved data-transmitting deps — reviewed and signed off
          # Add to this list (with story reference) when a new one is approved via PR review
          APPROVED_DEPS=(
            "@sentry/react-native"  # Story 1.1 — crash reporting to sentry.io, approved
          )

          FLAGGED_PATTERNS=("sentry" "analytics" "posthog" "mixpanel" "amplitude" "datadog" "newrelic" "crashlytics" "firebase" "segment" "heap" "fullstory")
          FOUND_ISSUES=0
          for pattern in "${FLAGGED_PATTERNS[@]}"; do
            MATCHES=$(grep -ril "\"$pattern" apps/*/package.json packages/*/package.json 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              for match_file in $MATCHES; do
                UNAPPROVED=$(grep -i "\"$pattern" "$match_file" || true)
                for approved in "${APPROVED_DEPS[@]}"; do
                  UNAPPROVED=$(echo "$UNAPPROVED" | grep -v "\"$approved\"" || true)
                done
                if [ -n "$UNAPPROVED" ]; then
                  echo "REVIEW REQUIRED: '$pattern' found in $match_file"
                  echo "$UNAPPROVED"
                  FOUND_ISSUES=1
                fi
              done
            fi
          done
          if [ "$FOUND_ISSUES" -eq 1 ]; then
            echo "ARC-013: New data-transmitting dependencies require explicit sign-off before merge."
            exit 1
          fi
          echo "PASS: No unreviewed third-party data transmitters found"

  # ─── Gate 5: Supabase client import boundary (ARC-006) ─────────────────────
  supabase-import-gate:
    name: "ARC-006 — @supabase/supabase-js boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check @supabase/supabase-js only imported inside packages/supabase
        run: |
          if grep -rE "from ['\"]@supabase/supabase-js['\"]|require\(['\"]@supabase/supabase-js['\"]" \
            apps/ packages/sync/ packages/ui/ packages/core/ 2>/dev/null; then
            echo "FAIL: @supabase/supabase-js imported outside packages/supabase (ARC-006)"
            echo "Use @exposure-buddy/supabase instead"
            exit 1
          fi
          echo "PASS: @supabase/supabase-js boundary is clean"

  # ─── Gate 6: actual_suds rename guard (AC1 / Story 5.2) ────────────────────
  actual-suds-rename-gate:
    name: "AC1 — no actual_suds references post-migration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual_suds was fully renamed to peak_suds
        run: |
          if grep -r "actual_suds" packages/ apps/ supabase/migrations/ | grep -v "0015_rename\|0013_fear_ladder_items"; then
            echo "FAIL: 'actual_suds' reference found outside the rename migration (AC1 / Story 5.2)"
            echo "All references must use 'peak_suds'. See supabase/migrations/0015_rename_actual_suds_to_peak_suds.sql"
            exit 1
          fi
          echo "PASS: no actual_suds references found"

  # ─── Gate 7: PowerSync schema drift (Story 9.1 / NFR-OFFLINE-01) ───────────
  verify-schema-drift:
    name: "Story 9.1 — verify-schema-drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packages/sync/src/schema.ts matches migration history
        run: bash scripts/ci/verify-schema-drift.sh

  # ─── Gate 8: PowerSync sync-rules bucket coverage (Story 9.1) ──────────────
  verify-sync-bucket-coverage:
    name: "Story 9.1 — verify-sync-bucket-coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every AppSchema table has sync-rules.yaml bucket coverage
        run: bash scripts/ci/verify-sync-bucket-coverage.sh

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: "Build all packages"
    runs-on: ubuntu-latest
    needs: [core-boundary-gate, dark-mode-gate, web-import-gate, sdk-dep-audit, supabase-import-gate, actual-suds-rename-gate, verify-schema-drift, verify-sync-bucket-coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo build

  # ─── Typecheck ──────────────────────────────────────────────────────────────
  typecheck:
    name: "TypeScript — strict mode"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm turbo typecheck

  # ─── Lint — i18n + a11y gates (Story 1.6) ───────────────────────────────────
  lint:
    name: "Lint — i18n + a11y gates"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint all packages
        run: pnpm turbo lint

  # ─── Test — Vitest (packages) + Jest (apps/mobile) (Story 9.2) ─────────────
  # First repo-wide test gate: pnpm turbo test fans out to every package/app's
  # existing test task via turbo.json, not just this story's new offline-recovery
  # suites — see Story 9.2 Task 7.2.
  test:
    name: "Test — Vitest + Jest"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all package/app test suites
        run: pnpm turbo test

  # ─── E2E Smoke — Maestro flows against local Supabase + Android emulator (Story 9.5) ─
  # Gated on build (same as typecheck/lint/test). KVM-enabled ubuntu-latest emulator.
  # See docs/setup/local-environment.md § Running the Maestro E2E suite for local usage.
  # See .github/workflows/e2e-spike.yml for the feasibility spike that validated this approach.
  e2e-smoke:
    name: "E2E Smoke — Maestro (Android)"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      # ── Reclaim disk space — android system images + Docker images exhaust the default 14GB ──
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ── KVM for hardware-accelerated Android virtualization ─────────────────────
      - name: Enable KVM (udev rules)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Local Supabase ─────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── Android SDK + Java ────────────────────────────────────────────────────────
      - name: Set up Java (Android build requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Install Maestro CLI ────────────────────────────────────────────────────────
      # Maestro is a standalone binary, not an npm package — does not trip sdk-dep-audit
      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      # ── Build APK before emulator boots (avoids CPU contention crashing QEMU threads) ──
      # Sets env vars from eas.json e2e profile explicitly; 10.0.2.2 is the Android
      # emulator's loopback alias for the CI host's localhost where Supabase will listen.
      - name: Build E2E APK
        run: |
          cd apps/mobile
          APP_VARIANT="development" \
          EXPO_PUBLIC_APP_VARIANT="development" \
          EXPO_PUBLIC_SUPABASE_URL="http://10.0.2.2:54321" \
          EXPO_PUBLIC_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" \
          pnpm exec expo prebuild --platform android --clean
          cd android
          APP_VARIANT="development" \
          EXPO_PUBLIC_APP_VARIANT="development" \
          EXPO_PUBLIC_SUPABASE_URL="http://10.0.2.2:54321" \
          EXPO_PUBLIC_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" \
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/exposure-buddy-e2e.apk
          echo "APK built: $(du -sh /tmp/exposure-buddy-e2e.apk | cut -f1)"

      # ── Start Supabase before emulator boots (reads keys into GITHUB_ENV) ─────────
      - name: Start Supabase
        run: |
          supabase start
          eval "$(supabase status -o env 2>/dev/null | grep -E '^[A-Z_][A-Z0-9_]*=')"
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-}}"
          SUPABASE_URL="${SUPABASE_URL:-${API_URL:-http://127.0.0.1:54321}}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=${SUPABASE_URL}" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=http://127.0.0.1:54324" >> "$GITHUB_ENV"

      # ── Boot emulator and run Maestro flows (APK + Supabase already ready) ───────
      - name: Run E2E smoke suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: Nexus 6
          avd-name: e2e_smoke_emulator
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            export PATH="$PATH:$HOME/.maestro/bin" &&
            adb install -r /tmp/exposure-buddy-e2e.apk &&
            ~/.maestro/bin/maestro test
            apps/mobile/.maestro/onboarding.yaml
            apps/mobile/.maestro/ladder-build.yaml
            apps/mobile/.maestro/exposure-loop.yaml
            apps/mobile/.maestro/debrief.yaml
            apps/mobile/.maestro/backgrounded-recovery.yaml
            --output /tmp/maestro-artifacts
            --env SUPABASE_URL="${SUPABASE_URL}"
            --env MAILPIT_URL="${MAILPIT_URL}"
            --env SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
            --env APP_PACKAGE="com.exposurebuddy.app"

      # ── Upload Maestro failure artifacts ──────────────────────────────────────────
      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-artifacts
          path: /tmp/maestro-artifacts/
          retention-days: 7
