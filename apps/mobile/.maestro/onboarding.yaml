# Story 9.5, Task 4 — onboarding.yaml (AC 2.1)
#
# Exercises the REAL signup/OTP path (not the DEV bypass) — this flow exists specifically
# to catch regressions in the signup/OTP flow the DEV bypass skips.
# Uses a per-invocation-unique email (Task 4.2) to avoid OTP rate-limiting under
# Task 9.3's mandated back-to-back reruns within the same supabase db reset cycle.
#
# Required env vars (passed via --env in run-e2e-smoke.sh):
#   MAILPIT_URL   — Mailpit REST base URL (from `supabase status -o env`)
appId: com.exposurebuddy.app
---
# Generate a per-invocation-unique email for this run
- runScript: setup/generateEmail.js

# Launch app — defaults to signup mode on fresh install
- launchApp

# Ensure we're on the signup tab
- tapOn:
    text: "Create account"

# Enter the unique test email.
# The "Email address" identifier-type tab (index 0) and the TextInput (index 1) share the
# same accessibilityLabel (t('auth.otp.emailLabel')). Email mode is the default on fresh
# install, so no tab tap is needed — target the TextInput directly with index: 1.
- tapOn:
    text: "Email address"
    index: 1
- eraseText: 50
- inputText: ${output.email}

# Guard against Android's first-keystroke race: inputText can start typing before the
# field has focus, silently dropping the leading character(s) — a CI run typed
# "2e-onboarding-…" for "e2e-onboarding-…", so the OTP email went to an address fetchOtp
# never polls. If the field doesn't show the exact email, erase and retype once, then
# hard-assert so a repeat failure stops HERE with a clear screenshot instead of 60s later
# in fetchOtp.
- runFlow:
    when:
      notVisible: ${output.email}
    commands:
      - tapOn:
          text: "Email address"
          index: 1
      - eraseText: 50
      - inputText: ${output.email}
- assertVisible: ${output.email}

# Dismiss the keyboard before tapping the consent checkboxes below the input. With the
# keyboard up, the tap on the age checkbox landed off-target and left it unchecked, which
# keeps "Send code" disabled (isSendDisabled) so the OTP is never sent and fetchOtp fails.
- hideKeyboard

# Agree to both consent checkboxes (required in signup mode; gates "Send code")
# (a11y labels: t('auth.safety.ageConfirmation') and t('auth.safety.medicoLegalDisclaimer'))
- tapOn:
    text: "I confirm I am 18 years of age or older"
- tapOn:
    text: "I understand that Exposure Buddy is a general health and wellness app. Its content is not a substitute for professional medical advice and is not valid for medico-legal proceedings."

# Send OTP.
# The app reaches Supabase through `adb reverse` to 127.0.0.1 (see ci.yml). On success the
# app navigates to otp-verification (shows "One-time passcode"). If the request stalls, the
# app's EXPO_PUBLIC_FETCH_TIMEOUT_MS (10s in the E2E APK) aborts it, re-enabling the Send
# button — so each retry below waits 15s (past that timeout) before re-tapping. Re-tapping
# sooner is a no-op: while the request is in flight the button is disabled (isLoading).
# The waits are `optional: true` so a not-yet-visible OTP screen falls through to the next
# retry instead of failing the flow; the final wait is a hard assertion.
- tapOn:
    text: "Send code"
- extendedWaitUntil:
    visible: "One-time passcode"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "One-time passcode"
    commands:
      - tapOn:
          text: "Send code"
      - extendedWaitUntil:
          visible: "One-time passcode"
          timeout: 15000
          optional: true
- runFlow:
    when:
      notVisible: "One-time passcode"
    commands:
      - tapOn:
          text: "Send code"
- extendedWaitUntil:
    visible: "One-time passcode"
    timeout: 15000

# Retrieve OTP from Mailpit — poll with backoff since email delivery is async.
# output.email is still set from generateEmail.js above (output persists across runScript calls).
- runScript:
    file: setup/fetchOtp.js
    env:
      MAILPIT_URL: ${MAILPIT_URL}
      OTP_TO_EMAIL: ${output.email}

# Enter OTP code on the verification screen (otp-verification.tsx)
- tapOn:
    text: "One-time passcode"
- inputText: ${output.otpCode}

# Verify
- tapOn:
    text: "Verify"
- waitForAnimationToEnd

# ── Onboarding flow ──────────────────────────────────────────────────────────────────────

# welcome.tsx
- tapOn:
    text: "Get started"
- waitForAnimationToEnd

# assessment.tsx — SUDS calibration widget: pick value 5
# (SudsCalibrationWidget a11y labels: "N out of 10" for N in 0..10)
# Do not use any value from CRISIS_KEYWORDS in subsequent text fields
- tapOn:
    text: "5 out of 10"

# assessment CTA "Next" (disabled until a SUDS value is picked). The CTA sits below the SUDS
# widget in a ScrollView — on the emulator it's below the fold, so scroll it into view first.
- scrollUntilVisible:
    element:
      text: "Next"
    direction: DOWN
- tapOn:
    text: "Next"
- waitForAnimationToEnd

# ladder.tsx (onboarding) — add one fear item, then proceed
# Description must NOT match any string in CRISIS_KEYWORDS (packages/core/src/crisis/keywords.ts)
- scrollUntilVisible:
    element:
      text: "Describe the situation"
    direction: DOWN
- tapOn:
    text: "Describe the situation"
- eraseText: 50
- inputText: "Riding the elevator alone"
- hideKeyboard
- tapOn:
    text: "5 out of 10"
- scrollUntilVisible:
    element:
      text: "Add to ladder"
    direction: DOWN
- tapOn:
    text: "Add to ladder"
- waitForAnimationToEnd

# CTA is "Next" when items.length > 0 (canSkip is false)
- scrollUntilVisible:
    element:
      text: "Next"
    direction: DOWN
- tapOn:
    text: "Next"
- waitForAnimationToEnd

# complete.tsx — marks onboardingComplete in MMKV, routes to home
- scrollUntilVisible:
    element:
      text: "Start your journey"
    direction: DOWN
- tapOn:
    text: "Start your journey"
- waitForAnimationToEnd

# ── Final assertion ──────────────────────────────────────────────────────────────────────
# First-time home visit shows "Your Courage Ladder is ready. Let's go!" (home.readyToStart)
- assertVisible: "Your Courage Ladder is ready. Let's go!"
