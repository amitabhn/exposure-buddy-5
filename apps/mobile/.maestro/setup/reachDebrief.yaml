# Story 9.5, Task 6.3 — Self-contained subflow: signs in, ensures onboarding, adds a
# pending ladder item via UI, and drives the full exposure loop to the debrief screen.
#
# Used by: exposure-loop.yaml (which also asserts on debrief screen itself)
#           debrief.yaml (via runFlow: for its own leading setup)
#
# Both pre-SUDS (intent) and exit SUDS (active completion modal) are kept BELOW 8
# to avoid the crisis-contacts block on debrief.tsx (renders if either value ≥ 8).
#
# Task 1.5 resolution: CI has no PowerSync cloud connection, so seeding via PostgREST
# and waiting for PowerSync sync was unreliable. Replaced with UI-based item addition
# (same pattern as backgrounded-recovery.yaml): writes go to the on-device PowerSync
# local queue which is immediately readable without a cloud sync round-trip.
appId: com.exposurebuddy.app
---
# ── Setup ──────────────────────────────────────────────────────────────────────────────────
# Sign in + complete onboarding idempotently; lands on home in empty-ladder state
- runFlow: ensureOnboarded.yaml
- waitForAnimationToEnd

# ── Add a ladder item via the standalone editor (no PostgREST / PowerSync cloud needed) ───
# Home empty-ladder state shows "Add situation" button (accessibilityLabel: t('ladder.addItem'))
- tapOn:
    label: "Add situation"
- waitForAnimationToEnd

# We're now on /ladder. Add "Facing a crowd" (SUDS 5) via the shared subflow.
- runFlow: addLadderItem.yaml

# Navigate back to home
- tapOn:
    label: "Go back"
- waitForAnimationToEnd

# ── Navigate from home to the item's "Start session" button ────────────────────────────────
# Home screen 'morning' state: CourageLadderEntryCard.
# accessibilityLabel: t('home.courageCard.itemLabel', {description, suds})
#   = "Facing a crowd, anxiety level 5 out of 10"
- tapOn:
    label: "Facing a crowd, anxiety level 5 out of 10"
- waitForAnimationToEnd

# Ladder screen: tap "Start session" for the pending item
# accessibilityLabel: `${t('ladder.startSession')}, ${item.description}`
- tapOn:
    label: "Start session, Facing a crowd"
- waitForAnimationToEnd

# ── Exposure session loop ──────────────────────────────────────────────────────────────────

# technique.tsx — select "Somatic" technique card (accessibilityRole: "radio")
- tapOn:
    label: "Somatic"
- tapOn:
    label: "Continue"
- waitForAnimationToEnd

# intent.tsx — pre-SUDS: pick 4 (below 8 to avoid crisis-contacts block on debrief)
# SudsScale anchor label: "4 — Mild"
- tapOn:
    label: "4 — Mild"
- tapOn:
    label: "Continue"
- waitForAnimationToEnd

# briefing.tsx — forward-only screen
- tapOn:
    label: "I'm ready"
- waitForAnimationToEnd

# active.tsx — log one SUDS reading
- tapOn:
    label: "Log how I'm feeling"
- waitForAnimationToEnd
# SUDS log modal: value 5 (non-anchor value, label is the number string "5")
- tapOn: "5"
- tapOn:
    label: "Log"
- waitForAnimationToEnd

# Complete the exposure — opens the completion/exit modal
- tapOn:
    label: "Complete exposure"
- waitForAnimationToEnd
# Exit SUDS: pick 4 — Mild (below 8)
- tapOn:
    label: "4 — Mild"
- tapOn:
    label: "Finish session"
- waitForAnimationToEnd

# Assert debrief screen is visible (reflection prompt text)
- assertVisible: "What would you like to remember about this?"
