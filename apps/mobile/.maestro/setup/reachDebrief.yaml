# Story 9.5, Task 6.3 — Self-contained subflow: signs in, ensures onboarding, seeds a
# pending ladder item, and drives the full exposure loop to the debrief screen.
#
# Used by: exposure-loop.yaml (which also asserts on debrief screen itself)
#           debrief.yaml (via runFlow: for its own leading setup)
#
# Both pre-SUDS (intent) and exit SUDS (active completion modal) are kept BELOW 8
# to avoid the crisis-contacts block on debrief.tsx (renders if either value ≥ 8).
#
# IMPORTANT — PowerSync dependency (Task 1.5 open question):
#   seedPendingLadderItem.js writes to Postgres via PostgREST. The app's ladder screen
#   reads from the on-device PowerSync SQLite replica (packages/sync/src/schema.ts).
#   If no local PowerSync sync stream is reachable in CI, the seeded row may not appear
#   in the on-device UI. Resolve this during Task 1.5's spike. If PowerSync is not
#   reachable, fall back to adding the item via the ladder UI (like backgrounded-recovery.yaml).
#
# Required env vars:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (for seedPendingLadderItem.js)
appId: ${APP_PACKAGE}
---
# ── Setup ──────────────────────────────────────────────────────────────────────────────────
# Sign in + complete onboarding idempotently
- runFlow: ensureOnboarded.yaml

# Ensure test1@test.com exists (idempotent; seedAuthUser exposes userId in output)
- runScript:
    file: seedAuthUser.js
    env:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

# Seed a pending ladder item in Postgres (effective only if PowerSync sync stream is reachable)
- runScript:
    file: seedPendingLadderItem.js
    env:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SEED_USER_ID: ${output.userId}

# Wait for PowerSync sync to propagate the seeded item to the on-device SQLite replica
- waitForAnimationToEnd

# ── Navigate from home to the seeded item's "Start session" button ─────────────────────────
# Home screen 'morning' state: CourageLadderEntryCard taps through to /ladder.
# accessibilityLabel: t('home.courageCard.itemLabel', {description, suds})
#   = "Riding the elevator alone, anxiety level 5 out of 10"
- tapOn:
    label: "Riding the elevator alone, anxiety level 5 out of 10"
- waitForAnimationToEnd

# Ladder screen: tap "Start session" for the pending item
# accessibilityLabel: `${t('ladder.startSession')}, ${item.description}`
- tapOn:
    label: "Start session, Riding the elevator alone"
- waitForAnimationToEnd

# ── Exposure session loop ──────────────────────────────────────────────────────────────────

# technique.tsx — select "Somatic" technique card (accessibilityRole: "radio")
- tapOn:
    label: "Somatic"
- tapOn:
    label: "Continue"
- waitForAnimationToEnd

# intent.tsx — pre-SUDS: pick 4 (below 8 to avoid crisis-contacts block on debrief)
# SudsScale anchor label: "4 — Mild"
- tapOn:
    label: "4 — Mild"
- tapOn:
    label: "Continue"
- waitForAnimationToEnd

# briefing.tsx — forward-only screen
- tapOn:
    label: "I'm ready"
- waitForAnimationToEnd

# active.tsx — log one SUDS reading
- tapOn:
    label: "Log how I'm feeling"
- waitForAnimationToEnd
# SUDS log modal: value 5 (non-anchor value, label is the number string "5")
- tapOn: "5"
- tapOn:
    label: "Log"
- waitForAnimationToEnd

# Complete the exposure — opens the completion/exit modal
- tapOn:
    label: "Complete exposure"
- waitForAnimationToEnd
# Exit SUDS: pick 4 — Mild (below 8)
- tapOn:
    label: "4 — Mild"
- tapOn:
    label: "Finish session"
- waitForAnimationToEnd

# Assert debrief screen is visible (reflection prompt text)
- assertVisible: "What would you like to remember about this?"
