# Story 9.5, Task 3.3 — Idempotent DEV-bypass sign-in + onboarding click-through.
#
# Used as the first step in: ladder-build.yaml, exposure-loop.yaml, debrief.yaml,
# backgrounded-recovery.yaml.
#
# Mechanism:
#   1. Sign in via the DEV bypass button (test1@test.com / DevTest123!) — this avoids
#      the real OTP path that onboarding.yaml exists specifically to cover.
#   2. If the app lands on the welcome screen (onboarding not yet complete in MMKV),
#      click through onboarding once via _onboarding-clickthrough.yaml — skipping the
#      ladder step with 0 items (canSkip is true when items.length === 0).
#   3. If the app lands directly on home (MMKV shows onboarding complete from a prior
#      flow in this CI run), do nothing — already done.
#
# The no-op path is a PERFORMANCE OPTIMIZATION only. Each consuming flow's call to
# this subflow is independently correct and idempotent regardless of execution order.
# See Dev Notes § Flow independence and § On-device vs. server-side state.
appId: com.exposurebuddy.app
---
# Ensure test1@test.com exists before the DEV sign-in tap (idempotent — 422 = already exists).
- runScript:
    file: seedAuthUser.js
    env:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

# clearState wipes auth tokens + MMKV so prior flows' sessions never bleed in.
# The no-op onboarding path below is a perf optimisation only; correctness holds
# whether or not MMKV state survived.
- launchApp:
    stopApp: true
    clearState: true
# Story 10.1 made the sign-in screen taller (third tab row + password field render by
# default), so the DEV button — the ScrollView's LAST element — can sit below the fold
# on the CI emulator. tapOn does not auto-scroll; bring it into view first.
- scrollUntilVisible:
    element:
      text: "DEV: Sign in as test user"
- tapOn: "DEV: Sign in as test user"
- waitForAnimationToEnd

# Conditionally complete onboarding only if the welcome screen appeared.
# If the app navigated directly to home, the runFlow condition is false and we skip.
- runFlow:
    when:
      visible: "Your journey starts here"
    file: _onboarding-clickthrough.yaml
