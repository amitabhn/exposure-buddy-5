# Private helper — called by ensureOnboarded.yaml when the welcome screen is visible.
# Not intended to be run as a standalone top-level flow.
#
# Completes onboarding with zero ladder items (Skip path):
#   welcome → assessment → ladder (Skip) → complete → home
appId: com.exposurebuddy.app
---
# welcome.tsx — "Get started"
- tapOn:
    text: "Get started"
- waitForAnimationToEnd

# assessment.tsx — SUDS slider: from unset, one tap on + lands on 5
- tapOn:
    text: "Increase rating"

# assessment.tsx CTA — "Next" (disabled until a SUDS value is picked). The CTA sits below the
# SUDS widget in a ScrollView — on the emulator it's below the fold, so scroll it into view first.
- scrollUntilVisible:
    element:
      text: "Next"
    direction: DOWN
- tapOn:
    text: "Next"
- waitForAnimationToEnd

# ladder.tsx (onboarding) — Skip with zero items
# (canSkip is true when items.length === 0; accessibilityLabel is t('onboarding.fearLadder.skipCta'))
- scrollUntilVisible:
    element:
      text: "Do this later"
    direction: DOWN
- tapOn:
    text: "Do this later"
- waitForAnimationToEnd

# complete.tsx — "Start your journey" (calls markOnboardingComplete(), writes MMKV)
- scrollUntilVisible:
    element:
      text: "Start your journey"
    direction: DOWN
- tapOn:
    text: "Start your journey"
- waitForAnimationToEnd
